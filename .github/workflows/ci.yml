name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group test
      - run: uv run --frozen --group test pytest -q --disable-socket --allow-unix-socket tests/unit_tests
      - if: matrix.python == '3.11'
        run: |
          uv run --frozen --group test ruff check langchain_smol tests
          uv run --frozen --group test ruff format langchain_smol tests --check
          uv run --frozen --group test ty check langchain_smol
          uv build
